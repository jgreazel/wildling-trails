<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2626">
  <meta name="description" content="Wildling Trails — an original cozy 3D creature-companion adventure that starts in the village of Fernhollow. Runs in your browser.">
  <title>Wildling Trails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main class="stage">
    <canvas id="game" aria-label="Game view: the village of Fernhollow"></canvas>
    <div class="hud">
      <location-banner></location-banner>
      <dialog-box></dialog-box>
      <touch-pad></touch-pad>
      <pause-menu></pause-menu>
      <story-card></story-card>
      <title-screen loading></title-screen>
      <fade-overlay></fade-overlay>
    </div>
    <p class="fatal" hidden></p>
    <noscript><p class="fatal">Wildling Trails needs JavaScript and WebGL to run.</p></noscript>
  </main>
</body>
</html>
